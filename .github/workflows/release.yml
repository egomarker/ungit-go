name: Release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Build frontend assets
        run: |
          npm ci
          npm run build:frontend

      - name: Test
        run: |
          go test ./...
          go vet ./...
          npm run test:graph-race

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            local os="$1" arch="$2" out="$3"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags='-s -w' -o "dist/$out" ./cmd/ungit-go
          }
          build linux amd64 ungit-go-linux-amd64
          build linux arm64 ungit-go-linux-arm64
          build windows amd64 ungit-go-windows-amd64.exe
          build windows arm64 ungit-go-windows-arm64.exe
          build darwin amd64 ungit-go-darwin-amd64
          build darwin arm64 ungit-go-darwin-arm64
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: ungit-go-binaries
          path: dist/*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
